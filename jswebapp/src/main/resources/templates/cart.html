<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart - Sneakers Shop</title>
  <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/home">Sneakers Shop</a>
  </div>
</nav>
<!-- Cart Section -->
<div class="container mt-5">
  <h2 class="text-center">Your Cart</h2>
  <div th:if="${cartItems.empty}" class="alert alert-warning text-center">Your cart is empty.</div>

  <div class="row" th:if="${not cartItems.empty}">
    <table class="table table-striped">
      <thead>
      <tr>
        <th>Product</th>
        <th>Quantity</th>
        <th>Price</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="item : ${cartItems}">
        <td th:text="${item.product.name}"></td>
        <td th:text="${item.quantity}"></td>
        <td th:text="${item.product.price * item.quantity} + ' $'"></td>
        <td>
          <button class="btn btn-danger" th:attr="onclick='removeFromCart(\'' + ${item.id} + '\')'">Remove</button>
        </td>
      </tr>
      </tbody>
    </table>
    <!-- Checkout Form -->
    <h3>Checkout</h3>
    <form id="checkoutForm" method="post" action="/cart/checkout">
      <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" id="fullName" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Address</label>
        <input type="text" class="form-control" id="address" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="text" class="form-control" id="phoneNumber" required>
      </div>
      <button type="button" class="btn btn-success" onclick="checkout()">Place Order</button>
    </form>
  </div>
</div>

<script>
  function removeFromCart(cartItemId) {
      const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
      const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

      fetch('/cart/remove/' + cartItemId, {
          method: 'DELETE',
          headers: {
              'Content-Type': 'application/json',
              [csrfHeader]: csrfToken
          }
      })
      .then(response => {
          if (response.ok) {
              location.reload();
          } else {
              alert("Failed to remove item from cart.");
          }
      })
      .catch(error => console.error('Error:', error));
  }

  function checkout() {
    const fullName = document.getElementById("fullName").value;
    const address = document.getElementById("address").value;
    const phoneNumber = document.getElementById("phoneNumber").value;

    if (!fullName || !address || !phoneNumber) {
        alert("Please fill in all fields.");
        return;
    }

    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

    fetch('/cart/checkout', {
        method: 'POST',
        credentials: 'include',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            [csrfHeader]: csrfToken
        },
        body: new URLSearchParams({
            fullName: fullName,
            address: address,
            phoneNumber: phoneNumber
        })
    })
    .then(response => {
        if (response.ok) {
            window.location.href = "/order/confirmation";
        } else {
            response.text().then(text => alert("Checkout failed: " + text));
        }
    })
    .catch(error => console.error('Error:', error));
}

</script>

</body>
</html>
