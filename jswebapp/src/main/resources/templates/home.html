<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home - Sneakers Shop</title>
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Sneakers Shop</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Cart</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Filter & Search Section -->
<div class="container mt-4">
    <div class="row">
        <!-- Search Bar -->
        <div class="col-md-6">
            <form id="searchForm" class="d-flex mb-3">
                <input class="form-control me-2" type="search" id="searchInput" placeholder="Search sneakers...">
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
        </div>
        <!-- Filter by Brand -->
        <div class="col-md-6 text-end">
            <label for="brandFilter" class="form-label text-dark fw-bold">Filter by brand:</label>
            <select id="brandFilter" class="form-select w-50 d-inline-block">
                <option value="">All Brands</option>
                <option value="Nike">Nike</option>
                <option value="Jordan">Jordan</option>
            </select>
        </div>
    </div>
</div>

<!-- Product List -->
<div class="container mt-5">
    <h2 class="text-center">Available Sneakers</h2>
    <div class="row" id="productList">
        <div class="col-md-4" th:each="product : ${products}">
            <div class="card mb-4 shadow-sm">
                <a th:href="@{'/products/' + ${product.id}}">
                    <img th:src="${product.thumbnail} ?: '/images/default.jpg'" class="card-img-top" alt="Sneaker Image">
                </a>
                <div class="card-body">
                    <h5 class="card-title">
                        <a th:href="@{'/products/' + ${product.id}}" th:text="${product.name}">Sneaker Name</a>
                    </h5>
                    <p class="card-text" th:text="${product.description}">Sneaker description</p>
                    <p class="fw-bold text-danger">$<span th:text="${product.price}">199.99</span></p>
                    <a href="#" class="btn btn-primary">Add to Cart</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS: Filter by Brand & Search -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const brandFilter = document.getElementById("brandFilter");
        const searchInput = document.getElementById("searchInput");
        const productCards = document.querySelectorAll(".card.mb-4");

        function filterProducts() {
            let selectedBrand = brandFilter.value.toLowerCase();
            let searchTerm = searchInput.value.toLowerCase();

            productCards.forEach(product => {
                let productBrand = product.getAttribute("data-brand").toLowerCase();
                let productName = product.getAttribute("data-name").toLowerCase();

                let matchesBrand = selectedBrand === "" || productBrand === selectedBrand;
                let matchesSearch = searchTerm === "" || productName.includes(searchTerm);

                if (matchesBrand && matchesSearch) {
                    product.style.display = "block";
                } else {
                    product.style.display = "none";
                }
            });
        }

        // Evenimente pentru Search și Filter
        brandFilter.addEventListener("change", filterProducts);
        searchInput.addEventListener("keyup", filterProducts);
    });
</script>


</body>
</html>
