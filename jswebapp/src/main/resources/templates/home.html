<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home - Sneakers Shop</title>
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
</head>
<body>
<!-- navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Sneakers Shop</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/cart}" class="btn btn-primary">Go to Cart</a>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-danger">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
<!-- filter&search -->
<div class="container mt-4">
    <div class="row">

        <div class="col-md-6">
            <form id="searchForm" class="d-flex mb-3">
                <input class="form-control me-2" type="search" id="searchInput" placeholder="Search sneakers...">
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
        </div>

        <div class="col-md-6 text-end">
            <label for="brandFilter" class="form-label text-dark fw-bold">Filter by brand:</label>
            <select id="brandFilter" class="form-select w-50 d-inline-block">
                <option value="">All Brands</option>
                <option value="Nike">Nike</option>
                <option value="Jordan">Jordan</option>
            </select>
        </div>
    </div>
</div>
<!-- products -->
<div class="container mt-5">
    <h2 class="text-center">Available Sneakers</h2>
    <div class="row" id="productList">
        <div class="col-md-4" th:each="product : ${products}">
            <div class="card mb-4 shadow-sm"
                 th:attr="data-brand=${product.brand}, data-name=${product.name}">
                <a th:href="@{'/products/' + ${product.id}}">
                    <img th:src="${product.thumbnail} ?: '/images/default.jpg'" class="card-img-top" alt="Sneaker Image">
                </a>
                <div class="card-body">
                    <h5 class="card-title">
                        <a th:href="@{'/products/' + ${product.id}}" th:text="${product.name}">Sneaker Name</a>
                    </h5>
                    <p class="card-text" th:text="${product.description}">Sneaker description</p>
                    <p class="fw-bold text-danger">$<span th:text="${product.price}">199.99</span></p>
                    <form class="add-to-cart-form" th:action="@{/cart/add}" method="post">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <input type="number" name="quantity" value="1" min="1" max="${product.quantity}" class="form-control w-25 d-inline">
                        <button type="submit" class="btn btn-primary">Add to Cart</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Bootstrap-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const brandFilter = document.getElementById("brandFilter");
        const searchInput = document.getElementById("searchInput");
        const productCards = document.querySelectorAll(".card.mb-4");

        function filterProducts() {
            let selectedBrand = brandFilter.value.toLowerCase();
            let searchTerm = searchInput.value.toLowerCase();

            productCards.forEach(product => {
                let productBrand = product.getAttribute("data-brand").toLowerCase();
                let productName = product.getAttribute("data-name").toLowerCase();

                let matchesBrand = selectedBrand === "" || productBrand.includes(selectedBrand);
                let matchesSearch = searchTerm === "" || productName.includes(searchTerm);

                if (matchesBrand && matchesSearch) {
                    product.style.display = "block";
                } else {
                    product.style.display = "none";
                }
            });
        }

        brandFilter.addEventListener("change", filterProducts);
        searchInput.addEventListener("keyup", filterProducts);
    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".add-to-cart-form").forEach(form => {
            form.addEventListener("submit", function (event) {
                event.preventDefault();

                let formData = new FormData(this);

                fetch(this.action, {
                    method: "POST",
                    body: new URLSearchParams(formData)
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Stock limit exceeded!");
                    }
                    return response.text();
                })
                .then(data => {
                    alert("✅ Product added to cart!");
                })
                .catch(error => {
                    alert("❌ Error: " + error.message);
                });
            });
        });
    });
</script>

</body>
</html>
