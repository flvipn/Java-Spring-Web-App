<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.name} + ' - Sneakers Shop'">Product</title>
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Sneakers Shop</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Cart</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Product Details -->
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
            <img th:src="${product.thumbnail} ?: '/images/default.jpg'" class="img-fluid rounded shadow">
        </div>
        <div class="col-md-6">
            <h2 th:text="${product.name}">Sneaker Name</h2>
            <p class="text-muted" th:text="${product.brand}">Brand</p>
            <p th:text="${product.description}">Product description</p>
            <h4 class="fw-bold text-danger">$<span th:text="${product.price}">199.99</span></h4>
            <p>Available: <span th:text="${product.available ? 'Yes' : 'No'}"></span></p>
            <p>Quantity: <span th:text="${product.quantity}"></span></p>
            <a href="#" class="btn btn-primary">Add to Cart</a>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
